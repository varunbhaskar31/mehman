<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a110b" />
    <title>You're offline · Mehman</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #1a110b;
        color: #f6efdf;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.9rem; margin: 20px 0 8px; }
      p { color: rgba(246, 239, 223, 0.72); margin: 0 0 24px; }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #a54824;
        color: #f6efdf;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #f6efdf; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Mehman needs a connection to show tables and bookings. Your bookings are safe; check back once you're online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
